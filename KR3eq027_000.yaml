body:
  text: 陽有餘陰不足論人受天地之氣以生天之陽氣為氣地之陰氣為血故氣常有餘血常不足何以言之天地為萬物父母天大也為陽而運於地之外地居天之中為陰天之大氣舉之日實也亦屬陽而運於月之外月缺也屬陰稟日之光以為明者也人身之陰氣其消長視月之盈缺故人之生也男子十六歲而精通女子十四歲而經行是有形之後猶有待於乳哺水穀以養陰氣始成而可與陽氣為配以能成人而為人之父母古人必近三十二十而後嫁娶可見陰氣之難於成而古人之善於攝養也禮記注曰惟五十然後養陰者有以加內經曰年至四十陰氣自半而起居衰矣又曰男子六十四歲而精絶女子四十九歲而經斷夫以陰氣之成止供得三十年之視聽言動已先虧矣人之情欲無涯此難成易虧之陰氣若之何而可以供給也經曰陽者天氣也主外陰者地氣也主內故陽道實陰道虛又曰至陰虛天氣絶至陽盛地氣不足觀虛與盛之所在非吾之過論主閉藏者腎也司疏泄者肝也二臟皆有相火而其繫上屬於心心君火也為物所感則易動心動則相火亦動動則精自走相火翕然而起雖不交會亦暗流而疏泄矣所以聖賢只是教人收心養心其旨深矣天地以五行更迭衰旺而成四時人之五臟六腑亦應之而衰旺四月屬巳五月屬午為火大旺火為肺金之夫火旺則金衰六月屬未為土大旺土為水之夫土旺則水衰況腎水常藉肺金為母以補助其不足故內經諄諄於資其化源也古人於夏必獨宿而淡味兢兢業業於愛護也保養金水二臟正嫌火土之旺爾內經曰冬不藏精者春必病溫十月屬亥十一月屬子正火氣潛伏閉藏以養其本然之真而為來春發生升動之本若於此時恣嗜欲以戕賊至春升之際下無根本陽氣輕浮必有溫熱之病夫夏月火土之旺冬月火氣之伏此論一年之虛耳若上弦前下弦後月廓月空亦為一月之虛大風大霧虹霓飛電暴寒暴熱日月薄蝕憂愁忿怒驚恐悲哀醉飽勞倦謀慮勤動又皆為一日之虛若病患初退瘡痍正作尤不止於一日之虛今日多有春末夏初患頭痛腳軟食少體熱仲景謂春夏劇秋冬瘥而脈弦大者正世俗所謂注夏病若犯此四者之虛似難免此夫當壯年便有老態仰事俯育一切隳壞興言至此深可驚懼古人謂不見所欲使心不亂夫以溫柔之盛於體聲音之盛於耳顏色之盛於目馨香之盛於鼻誰是鐵漢心不為之動也善攝生者於此五個月出居於外苟值一月之虛亦宜暫遠惟幕各自珍重保全天和期無負敬身之教幸甚治病必求其本論病之有本猶草之有根也去葉不去根草猶在也治病猶去草病在臟而治腑病在表而攻裡非惟戕賊胃氣抑且資助病邪醫云乎哉族叔祖年七十稟甚壯形甚瘦夏末患泄利至深秋百方不應豫視之日病雖久而神不悴小便澀少而不赤兩手脈俱澀而頗弦自言鬲微悶食亦減因悟曰此必多年沉積僻在胃腸詢其平生喜食何物曰我喜食鯉魚三年無一日缺豫曰積痰在肺肺為大腸之臟宜大腸之本不固也當與澄其源而流自清以茱萸陳皮青蔥蔍苜根生薑煎濃湯和以沙糖飲一碗許自以指探喉中至半時辰吐痰半升許如膠是夜減半次早又飲又吐半升而利止又與平胃散加白朮黃連旬日而安東陽王仲延遇諸途來告曰我每日食物必屈曲自鬲而下且硬澀作微痛它無所苦此何病脈之右甚澀而關尤沉左卻和豫曰汙血在胃脘之口氣因鬱而為痰此必食物所致明以告我彼亦不自覺豫又曰汝去臘食何物為多曰我每日必早飲點剁酒二三盞逼寒氣為制一方用韭汁半銀盞冷飲細呷之盡韭菜半斤而病安已而果然又一鄰人年三十餘性狡而躁素患下疳瘡或作或止夏初患自利鬲上微悶醫與治中湯二帖昏悶若死片時而蘇豫脈之兩手皆澀重取略弦似數豫曰此下疳瘡之深重者與當歸龍薈丸去麝四帖而利減又與小柴胡去半夏加黃連芍藥川芎生薑煎五六帖而安彼三人者俱是澀脈或弦或不弦而治法迥別不求其本何以議藥澀脈論人一呼脈行三寸一吸脈行三寸呼吸定息脈行六寸一晝一夜一萬三千五百息脈行八百一十丈此平人血氣運行之定數也醫者欲知血氣之病與不病非切脈不足以得之脈之狀不一載於脈經者二十有四浮沉芤滑實弦緊洪微緩澀遲伏濡弱數細動虛促結代革散其狀大率多兼見人之為病有四曰寒曰熱曰實曰虛故學脈者亦必以浮沉遲數為之綱以察病情此不易之論也然澀之見固多虛寒亦有痼熱為病者醫於指下見有不足之氣象便以為虛或以為寒孟浪與藥無非熱補輕病為重重病為死者多矣何者人之所藉以為生者血與氣也或因憂鬱或因厚味或因無汗或因補劑氣騰血沸清化為濁老痰宿飲膠固雜糅脈道阻澀不能自行亦見澀狀若重取至骨來似有力且帶數以意參之於證驗之形氣但有熱證當作痼熱可也此論為初學者發圓機之士必以為贅東陽吳子年方五十形肥味厚且多憂怒脈常沉澀自春來得痰氣病醫認為虛寒率與燥熱香竄之劑至四月間兩足弱氣上衝飲食減召我治之豫曰此熱鬱而脾虛痿厥之證作矣形肥而脈沉未是死證但藥邪太盛當此火旺實難求生且與竹瀝下白朮膏盡二斤氣降食進一月後大汗而死書此以為諸賢覆轍戒云養老論人生至六十七十以後精血俱耗平居無事已有熱證何者頭昏目眵肌癢溺數鼻涕牙落涎多寐少足弱耳聵健忘眩運腸燥面垢發脫眼花久坐兀睡未風先寒食則易飢笑則有淚但是老境無不有此或曰局方烏附丹劑多與老人為宜豈非以其年老氣弱不虛理宜溫補今子皆以為熱烏附丹劑將不可施之老人耶余曉之曰奚止烏附丹劑不可妄用至於好酒膩肉濕面油汁燒炙煨炒辛辣甜滑皆在所忌或曰子何愚之甚耶甘旨養老經訓具在為子為婦甘旨不及孝道便虧而吾子之言若是其將有說以通之乎願聞其略豫愀然應之曰正所謂道並行而不悖者請詳言之古者井田之法行鄉閭之教興人知禮讓比屋可封肉食不及幼壯五十才方食肉強壯恣叨比及五十疾已蜂起氣耗血竭筋柔骨痿腸胃壅閼涎沫充溢而況人身之陰難成易虧六七十後陰不足以配陽孤陽幾欲飛越因天生胃氣尚爾留連又藉水穀之陰故羈縻而定耳所陳前證皆是血少內經曰腎惡燥烏附丹劑非燥而何夫血少之人若防風半夏蒼朮香附但是燥劑且不敢多況烏附丹劑乎或者又曰一部局方悉是溫熱養陽吾子之言無乃謬妄乎豫曰局方用燥劑為劫濕病也濕得燥則豁然而收局方用暖劑為劫虛病也補腎不如補脾脾得溫則易化而食味進下雖暫虛亦可少回內經治法亦許用劫正是此意蓋為質厚而病淺者設此亦儒者用權之意若以為經常之法豈不大誤彼老年之人質雖厚此時亦近乎薄病雖淺其本亦易以撥而可以劫藥取速效乎若夫形肥者血少形瘦者氣實間或可用劫藥者設或失手何以取救吾寧稍遲計出萬全豈不美乎烏附丹劑其不可輕餌也明矣至於飲食尤當謹節夫老人內虛脾弱陰虧性急內虛胃熱則易飢而思食脾弱難化則食已而再飽陰虛難降則氣鬱而成痰至於視聽言動皆成廢懶百不如意怒火易熾雖有孝子順孫亦是動輒扼腕況未必孝順乎所以物性之熱者炭火製作者氣之香辣者味之甘膩者其不可食也明矣雖然腸胃堅厚福氣深壯者世俗觀之何妨奉養縱口固快一時積久必為災害由是觀之多不如少少不如絶爽口作疾厚味措毒前哲格言猶在人耳可不慎歟或曰如子之言殆將絶而不與於汝安乎豫曰君子愛人以德小人愛人以姑息況施於所尊者哉惟飲與食將以養生不以致疾若以所養轉為所害恐非君子之所謂孝與敬也然則如之何則可曰好生惡死好安惡病人之常情為子為孫必先開之以義理曉之以物性旁譬曲喻陳說利害意誠辭確一切以敬慎行之又次以身先之必將有所感悟而無捍格之逆矣吾子所謂絶而不與施於有病之時尤是孝道若無病之時量酌可否以時而進某物不食某物代之又何傷於孝道乎若夫平居閉話素無開導誘掖之言及至飢腸已鳴饞涎已動飲食在前馨香撲鼻其可禁乎經曰以飲食忠養之忠之一字恐與此意合請勿易看過豫事老母固有愧於古者然母年逾七旬素多痰飲至此不作節養有道自謂有術只因大便燥結時以新牛乳豬脂和糜粥中進之雖以暫時滑利終是膩物積多次年夏時郁為黏痰發為脅瘡連日作楚寐興隕穫為之子者置身無地因此苦思而得節養之說時進參術等補胃補血之藥隨天令加減遂得大腑不燥面色瑩潔雖覺瘦弱終是無病老境得安職此之由也因成一方用參術為君牛膝芍藥為臣陳皮茯苓為佐春加川芎夏加五味黃芩麥門冬冬加當歸身倍生薑一日或一帖或二帖聽其小水才覺短少便進此藥小水之長如舊即是卻病揵法後到東陽因聞老何安人性聰敏七十以後稍覺不快便卻粥數日單進人參湯數帖而止後九十餘無疾而卒以其偶同故筆之以求是正慈幼論人生十六歲以前血氣俱盛如日方升如月將圓惟陰長不足腸胃尚脆而窄養之之道不可不謹童子不衣裘帛前哲格言具在人耳裳下體之服帛溫軟甚於布也蓋下體主陰得寒涼則陰易長得溫暖則陰暗消是以下體不與帛絹夾厚溫暖之服恐妨陰氣實為確論血氣俱盛食物易消故食無時然腸胃尚脆而窄若稠黏乾硬酸鹹甜辣一切魚肉木果濕面燒炙煨炒但是發熱難化之物皆宜禁絶只與乾柿熟菜白粥非惟無病且不縱口可以養德此外生栗味鹹乾柿性涼可為養陰之助然栗大補柿大澀俱為難化亦宜少與婦人無知惟務姑息畏其啼哭無所不與積成痼疾雖悔何及所以富貴驕養有子多病逮至成人筋骨柔弱有疾則不能忌口以自養居喪則不能食素以盡禮小節不謹大義亦虧可不慎歟至於乳子之母尤宜謹節飲食下咽乳汁便通情欲動中乳脈便應病氣到乳汁必凝滯兒得此乳疾病立至不吐則瀉不瘡則熱或為口糜或為驚搐或為夜啼或為腹痛病之初來其溺必甚少便須詢問隨證調治母安亦安可消患於未形也夫飲食之擇猶是小可乳母稟受之厚薄情性之緩急骨相之堅脆德行之善惡兒能速肖尤為關係或曰可以已矣曰未也古之胎教具在方冊愚不必贅若夫胎孕致病事起茫昧人多玩忽醫所不知兒之在胎與母同體得熱則俱熱得寒則俱寒病則俱病安則俱安母之飲食起居尤當慎密東陽張進士次子二歲滿頭有瘡一日瘡忽自平遂患痰喘豫視之曰此胎毒也慎勿與解利藥衆皆愕然豫又曰乃母孕時所喜何物張曰辛辣熱物是其所喜因口授一方用人參連翹芎連生甘草陳皮芍藥木通濃煎沸湯入竹瀝與之數日而安或曰何以知之曰見其精神昏倦病受得深決無外感非胎毒而何豫之次女形瘦性急體本有熱懷孕三月適當夏暑口渴思水時發小熱遂教以四物湯加黃芩陳皮生甘草木通因懶於煎煮數帖而止其後此子二歲瘡痍遍身忽一日其瘡頓愈數日遂成痎瘧豫曰此胎毒也瘡若再作病必自安已而果然若於孕時確守前方何病之有又陳氏女八歲時得癇病遇陰雨則作遇驚亦作口出涎沫聲如羊鳴豫視之曰如胎受驚也其病深痼調治半年病亦可安仍須淡味以佐藥功與燒丹元繼以四物湯入黃連隨時令加減半年而安夏月伏陰在內論天地以一元之氣化生萬物根於中者曰神機根於外者曰氣血萬物同此一氣人靈於物形與天地參而為三者以其得氣之正而通也故氣升亦升氣浮亦浮氣降亦降氣沉亦沉人與天地同一橐籥子月一陽生陽初動也寅月三陽生陽初出於地也此氣之升也巳月六陽生陽盡出於上矣此氣之浮也人之腹屬地氣於此時浮於肌表散於皮毛腹中虛矣經曰夏月經滿地氣溢滿入經絡受血皮膚充實長夏氣在肌肉所以表實表實者里必虛世言夏月伏陰在內此陰字有虛之義若作陰冷看其誤甚矣或曰以手捫腹明知其冷非冷而何前人治暑病有玉龍丸大順散桂苓丸單煮良薑與縮脾飲用草果等皆行溫熱之劑何吾子不思之甚也豫曰春夏養陽王太僕謂春食涼夏食寒所以養陽也其意可見矣若夫涼臺水館大扇風車陰水寒泉果冰雪涼之傷自內及外不用溫熱病何由安詳玩其意實非為內伏陰而用之也前哲又謂升降浮沉則順之寒熱溫涼則逆之若於夏月火令之時妄投溫熱寧免實實虛虛之患乎或曰巳月純陽於理或通五月一陰六月二陰非陰冷而何豫曰此陰之初動於地下也四陽浮於地上燔灼焚燎流金爍石何陰冷之有孫真人制生脈散令人夏月服之非虛而何豆瘡陳氏方論讀前人之書當知其立言之意苟讀其書而不知其意求適於用不可得也豆瘡之論錢氏為詳歷舉源流經絡明分表裡虛實開陳其施治之法而又證以論辨之言深得著書垂教之體學者讀而用之如求方圓於規矩較平直於準繩引而伸之觸類而長之可為無窮之應用也今人不知致病之因不求立方之意倉卒之際據證檢方漫爾一試設有不應並其書而廢之不思之甚也近因局方之教久行素問之學不講抱疾談醫者類皆喜溫而惡寒喜補而惡解利忽得陳氏方論皆燥熱補劑其辭確其文簡歡然用之翕然信之遂以為錢氏不及陳氏遠矣或曰子以陳氏方為不足歟曰陳氏方誠一偏論雖然亦可謂善求病情者其意大率歸重於太陰一經蓋以手太陰屬肺主皮毛也足太陰屬脾主肌肉肺金惡寒而易於感脾胃土惡濕而無物不受觀其用丁香官桂所以治肺之寒也用附朮半夏所以治脾之濕也使其肺果有寒脾果有濕而兼有虛也量而與之中病即止何傷之有今也不然徒見其瘡之出遲者身熱者泄瀉者驚悸者氣急者渴思飲者不問寒熱虛實率投木香散異功散間有偶中隨手獲效設或誤投禍不旋蹱何者古人用藥制方有嚮導有監製有反佐有因用若錢氏方固未嘗廢細辛丁香白朮參耆等率有監製輔佐之藥不專務於溫補耳然其用涼寒者多而於輔助一法略開端緒未曾深及癡人之前不可說夢錢氏之慮至矣亦將以候達者擴充推廣而用雖然渴者用溫藥癢塌者用補藥自陳氏發之迥出前輩然其多用桂附丁香等燥熱恐未為適中也何者桂附丁香輩當有寒而虛固是的當虛而未必寒者其為害當何如耶陳氏立方之時必有挾寒而豆瘡者其用燥熱補之固其宜也今未挾寒而用一偏之方寧不過於熱乎豫嘗會諸家之粹求其意而用之實未敢據其成方也試舉一二以證之從子六七歲時患痘瘡發熱微渴自利一小方脈視之用木香散每帖又增丁香十粒豫切疑焉觀其出遲固因自利而氣弱察其所下皆臭滯陳積因腸胃熱蒸而下也恐非有寒而虛遂急止之已投一帖矣繼以黃連解毒湯加白朮與十帖以解丁香之熱利止瘡亦出其後肌常有微熱而手足生癰癤與涼劑調補逾月而安又一男子年十六七歲發熱而昏目無視耳無聞兩手脈皆豁大而略數知其為勞傷矣時里中多發痘者雖不知人與藥則飲與粥則食遂教參耆當歸白朮陳皮大料濃煎與之飲至三十餘帖痘始出又二十餘帖則成膿泡身無全膚或曰病勢可畏何不用陳氏全方治之余曰此但虛耳無寒也只守前方又數十餘帖而安後詢其病因謂先四五日恐有出痘之病遂極力樵採連日出汗甚多若用陳氏全方寧無後悔至正甲申春陽氣早動正月間邑間痘瘡不越一家卒投陳氏方童幼死者百餘人雖由天數吾恐人事亦或未之盡也痛風論氣行脈外血行脈內晝行陽二十五度夜行陰二十五度此平人之造化也得寒則行遲而不及得熱則行速而太過內傷於七情外傷於六氣則血氣之運或遲或速而病作矣彼痛風者大率因血受熱已自沸騰其後或涉冷水或立濕地或扇取涼或臥當風寒涼外摶熱血得寒汙濁凝澀所以作痛夜則痛甚行於陰也治法以辛熱之劑流散寒濕開發腠理其血得行與氣相和其病自安然亦有數種治法稍異謹書一二以證豫言東陽傅文年逾六十性急作勞患兩腿痛甚動則甚痛豫視之曰此兼虛證當補血溫血病當自安遂與四物湯加桃仁陳皮牛膝生甘草煎入生薑研潛行散熱飲三四十帖而安又朱宅閫內年近三十食味甚厚性躁急患痛風攣縮數月醫禱不應豫視之曰此挾痰與氣證當和血疏氣導痰病自安遂以潛行散入生甘草牛膝炒枳殼通草陳皮桃仁薑汁煎服半年而安又鄰鮑六年二十餘因患血痢用澀藥取效後患痛風叫號撼鄰豫視之曰此惡血入經絡證血受濕熱久必凝濁所下未盡留滯隧道所以作痛經久不治恐成偏枯遂與四物湯加桃仁紅花牛膝黃芩陳皮生甘草煎入生薑研潛行散入少酒飲之數十帖又與刺委中出黑血近三合而安或曰比見鄰人用草藥研酒飲之不過數帖亦有安者如子之言類皆經久取效無乃太迂緩乎豫曰此劫病草藥石上採石絲為之君過山龍等佐之皆性熱而燥者不能養陰卻能燥濕病之淺者濕痰得燥則開熱血得熱則行亦可取效彼病深而血少者愈劫愈虛愈劫愈深若朱之病是也子以我為迂緩乎痎瘧論內經謂夏傷於暑秋傷於風必有痎瘧痎瘧老瘧也以其隔兩日一作纏綿不休故有是名前賢具有治法然皆峻劑有非稟受性弱與居養所移者所宜用也惟許學士方有用參耆等補劑而又不曾深論後學難於推測因見近年以來五十歲以下之人多是怯弱者況嗜欲縱恣十倍於前以弱質而得深病最難為藥始悟常山烏梅砒丹等為劫痰之劑若誤用之輕病為重重病必死何者夫三日一作陰受病也作於子午卯酉日少陰瘧也作於寅申巳亥日厥陰瘧也作於辰戌醜未日太陰瘧也瘧得於暑當以汗解或涼臺水閣陰木冷地他人揮扇泉水澡浴汗不得泄鬱而成痰其初感也胃氣尚強全不自覺至於再感懵然無知又復恣意飲食過分勞動竭力房事胃氣大傷其病乃作深根固蒂宜其難愈病者欲速愈甘辛峻劑醫者欲急利遽便將投殊不知感風感暑皆外邪也當以汗解所感既深決非一二升汗可除亦有胃氣少回已自得汗不守禁忌又復觸冒舊邪未去新邪又感展轉沉滯其病愈深況來求治者率皆輕試速效劫病之藥胃氣重傷吾知其難免於禍矣由是甘為遲鈍範我馳驅必先以參朮陳皮芍藥等補劑輔以本經之藥惟其取汗若得汗而體虛又須重用補劑以助之俟汗出通身下過委中方是佳兆仍教以淡飲食省出外避風就溫遠去帷薄謹密調養無有不安若感病極深雖有大汗所感之邪必自臟傳出至腑其發也必亂而失期亦豈是佳兆故治此病春夏為易秋冬為難非有他也以汗之難易為優劣也或曰古方用砒丹烏梅常山得效者不為少子以為不可用乎豫曰腑受病者淺一日一作間一日一作者是胃氣尚強猶可與也彼三日一作者病已在臟矣在臟者難治以其外感猶可治也而可用劫藥以求速效乎前歲憲僉詹公稟甚壯形甚強色甚蒼年近六十二月得痎瘧召我視之知其飫於醲肥者告之曰須遠色食淡調理浹月得大汗乃安公不悅一人從旁曰此易耳數日可安與劫藥三五帖病退旬日後又作又與又退綿延至冬病猶未除又來求治豫知其久得藥痰亦少惟胃氣未完又天寒汗未透遂以白朮粥和丸與二斤令其遇飢時且未食取一二百丸以熱湯下只與白粥調養盡此藥當大汗而安已而果然如此者甚多但藥略有加減不必盡述病邪雖實胃氣傷者勿使攻擊論凡言治國者多借醫為喻仁哉斯言也真氣民也病邪賊盜也或有盜賊勢須剪除而後已良相良將必先審度兵食之虛實與時勢之可否然後動動涉輕妄則吾民先困於盜次困於兵民困而國弱矣行險僥幸小人所為萬象森羅果報昭顯其可不究心乎請舉一二以為凡例永康呂親形瘦色黑平生喜酒多飲不困年近半百且有別館忽一日大惡寒發戰且自言渴卻不飲豫診其脈大而弱惟右關稍實略數重取則澀遂作酒熱內郁不得外泄由表熱而不虛也黃耆一物以乾葛湯煎與之盡黃耆二兩乾葛一兩大得汗次早安矣又葉先生患滯下後甚逼迫正合承氣證豫曰氣口虛形雖實而面黃稍白此必平昔食過飽而胃受傷寧忍一二日辛苦遂與參朮陳皮芍藥等補藥十餘帖至三日後胃氣稍完與承氣兩帖而安苟不先補完胃氣之傷而遽行承氣吾恐病安之後寧免瘦憊乎又一婢色紫稍肥性沉多憂年近四十經不行三月矣小腹當中有一氣塊初起如栗漸如炊餅豫脈之兩手皆澀重取卻有試令按其塊痛甚捫之高半寸遂與千金消石丸至四五次彼忽自言乳頭黑且有汁恐有娠豫曰非也澀脈無孕之理又與三五帖脈之稍覺虛豁豫悟曰藥太峻矣令止前藥與四物湯倍加白朮佐以陳皮至三十帖候脈完再與消石丸至四五次忽自言塊消一暈便令莫服又半月經行痛甚下黑血半升內有如椒核數十粒乃塊消一半又來索藥以消余塊余曉之曰勿性急塊已開矣不可又攻若次月經行當盡消矣次月經行下少黑血塊又消一暈又來問藥余曰但守禁忌至次月必消盡已而果然大凡攻擊之藥有病則病受之病邪輕而藥力重則胃氣受傷夫胃氣者清純沖和之氣也惟與谷肉菜果相宜蓋藥石皆是偏勝之氣雖參耆輩為性亦偏況攻擊之藥乎此婦胃氣自弱好血亦少若塊盡而卻藥胃氣之存者幾希矣議論此至醫云乎哉治病先觀形色然後察脈問證論經曰診脈之道觀人勇怯肌肉皮膚能知其情以為診法也凡人之形長不及短大不及小肥不及瘦人之色白不及黑嫩不及蒼薄不及厚而況肥人濕多瘦人火多白者肺氣虛黑者腎氣足形色既殊臟腑亦異外證雖同治法迥別所以肥人貴脈浮瘦人貴脈沉躁人疑脈緩緩人疑脈躁以其不可一概觀也試陳一二可以例推東陽陳兄露筋體稍長患體虛而勞頭痛甚至有訣別之言余察其脈弦而大帶數以人參白朮為君川芎陳皮為佐至五六日未減衆皆訝之以藥之不對也余曰藥力有次第矣更少俟一二宿當自安忽其季來問何不少加黃耆豫笑不答又經一宿忽自言病頓愈豫脈之覺指下稍盛又半日病者言膈上滿不覺飢視其腹紋已隱矣豫曰夜來藥中莫加黃耆否曰然止與三帖遂速與二陳湯加厚朴枳殼黃連以瀉其衛三帖而安又浦江義門鄭兄年二十餘秋間大發熱口渴妄言妄見病似邪鬼七八日後召我治脈之兩手洪數而實視其形肥面赤帶白卻喜露筋脈本不實涼藥所致此因勞倦成病與溫補藥自安曰柴胡七八帖矣以黃耆附子湯冷與之飲三帖後困倦鼾睡微汗而解脈亦稍軟繼以黃耆白朮湯至十日脈漸收斂而小又與半月而安夫黃耆補氣藥也此兩人者一則氣虛一則氣實便有宜不宜存焉可不審乎大病不守禁忌論病而服藥須守禁忌孫真人千金方言之詳矣但不詳言所以守禁忌之由敢陳其略以為規戒夫胃氣者清純沖和之氣人之所賴以為生者也若謀慮神勞動作形苦嗜欲無節思想不遂飲食失宜藥餌違法皆能致傷既傷之後須用調補恬不知怪而乃恣意犯禁舊染之證與日俱積吾見醫將日不暇給而傷敗之胃氣無復完全之望去死近矣豫族叔形色俱實痎瘧又患痢自恃強健能食絶無忌憚一日召我曰我雖病卻健而能食但苦汗出耳汝能止此汗否豫曰痎瘧非汗出不能愈也可慮者正在健與能食耳此非痢也胃熱善消脾病不化食積與病勢已甚矣此時節擇飲食以養胃氣省出入以避風寒候汗透而安叔曰世俗謂無飽死痢我今能食何謂可慮余曰痢而能食者知胃氣未病也故言不死非謂恣食不節擇者不從所言恣口大嚼遇渴又多啖水果如此者月餘後雖欲求治不可著手矣淹淹又月餘而死內經以驕恣不倫於理為不治之病信哉又周其姓者形色俱實患痢善食而易飢大嚼不擇者五日矣豫責之曰病中當調補自養豈可滋味戕賊遂教之只用熟蘿蔔吃粥耳少與調治半月而安虛病痰病有似邪祟論血氣者身之神也神既衰乏邪因而入理或有之若夫血氣兩虧痰客中焦妨礙升降不得運用以致十二官各失其職視聽言動皆有虛妄以邪治之其人必死籲哉冤乎誰執其咎憲幕之子傅兄年十七八時暑月因大勞而渴恣飲梅漿又連得大驚三四次妄言妄見病似邪鬼診其脈兩手皆虛弦而帶沉數豫曰數為有熱虛弦是大驚又梅酸之漿鬱於中脘補虛清熱導去痰滯病乃可安遂與人參白朮陳皮茯苓芩連等濃煎湯入竹瀝薑汁與旬日未效衆皆尤藥之不審餘脈之知其虛之未完與痰之未導也仍與前方入荊瀝又旬日而安外弟歲一日醉飽後亂言妄語妄見詢之系伊亡兄附體言生前事甚的乃叔在旁叱之曰非邪食腥與酒太過痰所為耳灌鹽湯一大碗吐痰一二升汗因大作困睡一宵而安又金氏婦壯年暑月赴筵歸乃姑詢其坐次失序遂赧然自愧因成此病言語失倫其中又多間一句曰奴奴不是脈皆數而弦余曰此非邪乃病也但與補脾清熱導痰數日當自安其家不信邀數巫者噴水而咒之旬余而死或問曰病非邪而邪治之何遽至於死余曰暑月赴宴外境蒸熱辛辣適口內境鬱熱而況舊有積痰加之愧悶其痰與熱何可勝言今乃驚以法尺是驚其神而血不寧也噴以法水是審其體密其膚使汗不得泄也汗不泄則蒸熱內燔血不得寧則陰消而陽不能獨立也不死何俟或曰外臺祕要有禁嘰一科庸可廢乎豫曰移精變氣乃小術耳可治小病若內有虛邪外有實邪當用正大之法自有成式昭然可考然符水惟膈上熱痰一呷涼水胃熱得之豈不清快亦可取安若內傷而虛與冬嚴寒符水下咽必冰胃而致害彼鬱熱在上熱邪在表須以汗解率得清冷膚腠固密熱何由解必致內攻陰陽離散血氣乖爭去死為近面鼻得冷則黑論諸陽聚於頭則面為陽中之陽鼻居面中央而陽明起於頞中一身之血運到面鼻到面鼻陽部皆為至清至精之血矣酒性善行而喜升大熱而有峻急之毒多酒之人酒氣熏蒸面鼻得酒血為極熱熱血得冷為陰氣所摶汙濁凝結滯而不行宜其先為紫而後為黑色也須用融化滯血使之得流滋生新血可以運化病乃可愈豫為酒製四物湯加炒片茯苓陳皮生甘草酒紅花生薑煎調五靈脂末飲之氣弱者加酒黃耆無有不應者胎自墮論陽施陰化胎孕乃成血氣虛損不足榮養其胎自墮或勞怒傷情內火便動亦能墮胎推原其本皆因於熱火能消物造化自然病源乃謂風冷傷於子臟而墮此未得病情者也豫見賈氏婦但有孕至三個月左右必墮診其脈左手大而無力重取則澀知其少血也以其妙年只補中氣使血自榮時正初夏教以濃煎白朮湯下黃芩末一錢服三四十帖遂得保全而生因而思之墮於內熱而虛者於理為多曰熱曰虛當分輕重好生之工幸毋輕視難産論世之難産者往往見於鬱悶安佚之人富貴奉養之家若貧賤辛苦者無有也方書止有瘦胎飲一論而其方為湖陽公主作也實非極至之言何者見有此方其難自若豫族妹苦於難産後遇胎孕則觸而去之余甚憫焉視其形肥而勤於針指構思旬日忽自悟曰此正與湖陽公主相反彼奉養之人其氣必實耗其氣使和平故易産今形肥知其氣虛久坐知其不運而其氣愈弱久坐胞胎因母氣不能自運耳當補其母之氣則兒健而易産今其有孕至五六個月遂於大全方紫蘇飲加補氣藥與十數帖因得男而甚快後遂以此方隨母之形色性稟參以時令加減與之無不應者因名其方曰大達生散難産胞損淋瀝論常見尿胞因收生者不謹以致破損而得淋瀝病遂為廢疾一日有徐姓婦壯年得此因思肌肉破傷在外者且可補完胞雖在腹恐亦可治遂診其脈虛甚曰難産之由多是氣虛難産之後血氣尤虛試與峻補因以參術為君芎歸為臣桃仁陳皮黃耆茯苓為佐而煎以豬羊胞中湯極飢時飲之但劑率用一兩至一月而安蓋是氣血驟長其胞自完恐稍遲緩亦難成功胎婦轉胞病論轉胞病胎婦之稟受弱者憂悶多者性急躁者食味厚者大率有之古方皆用滑利疏導藥鮮有應效因思胞為胎所墮展在一邊胞系了戾不通者胎若舉起懸在中央胞系得疏水道自行然胎之墜下必有其由一日吳宅寵人患此脈之兩手似澀重取則弦然左手稍和余曰此得之憂患澀為血少氣多弦為有飲血少則胞弱而不能自舉氣多有飲中焦不清而溢則胞之所避而就下故墜遂以四物湯加參朮半夏陳皮生甘草生薑空心飲隨以指探喉中吐出藥汁俟少頃氣定又與一帖次早亦然如是與八帖而安此法未為的確恐偶中耳後又歷用數人亦效未知果如何耶仲景云婦人本肥盛且舉自滿全羸瘦且舉空減胞系了戾亦致胞轉其義未詳必有能知之者乳硬論乳房陽明所經乳頭厥陰所屬乳子之母不知調養怒忿所逆鬱悶所遏厚味所釀以致厥陰之氣不行故竅不得通而汁不得出陽明之血沸騰故熱甚而化膿亦有所乳之子膈有滯痰口氣焮熱含乳而睡熱氣所吹遂生結核於初起時便須忍痛揉令稍軟吮令汁透自可消散失此不治必成癰癤治法疏厥陰之滯以青皮清陽明之熱細研石膏行汙濁之血以生甘草之節消腫導毒以栝蔞子或加沒藥青橘葉皂角刺金銀花當歸或湯或散或加減隨意消息然須以少酒佐之若加以艾火兩三壯於腫處其效尤捷彼庸工喜於自炫便用針刀引惹拙痛良可哀憫若夫不得於夫不得於舅姑憂怒鬱悶昕夕積纍脾氣消阻肝氣橫逆遂成隱核如大棋子不痛不癢數十年後方為瘡陷名曰奶岩以其瘡形嵌凹似巖穴也不可治矣若於始生之際便能消釋病根使心清神安然後施之以治法亦有可安之理豫族侄婦年十八時曾得此病察其形脈稍實但性急躁伉儷自諧所難者後姑耳遂以本草單方青皮湯間以加減四物湯行以經絡之劑兩月而安受胎論成胎以精血之後先分男女者褚澄之論愚切惑焉後閲李東垣之方有曰經水斷後一二日血海始淨精勝其血感者成男四五日後血脈已旺精不勝血感者成女此確論也易曰乾道成男坤道成女夫乾坤陰陽之情性也左右陰陽之道路也男女陰陽之儀象也父精母血因感而會精之施也血能攝精成其子此萬物資始於乾元也血成其胞此萬物資生於坤元也陰陽交媾胎孕乃凝所藏之處名曰子宮一系在下上有兩岐一達於左一達於右精勝其血則陽為之主受氣於左子宮而男形成精不勝血則陰為之主受氣於右子宮而女形成或曰分男分女吾知之矣男不可為父女不可為母與男女之兼形者又若何而分之耶余曰男不可為父得陽氣之虧者也女不可為母得陰氣之塞者也兼形者由陰為駁氣所乘而成其類不一以女函男有二一則遇男為妻遇女為夫一則可妻而不可夫其有女具男之全者此又駁之甚者或曰駁氣所乘獨見於陰而所乘之形又若是之不同耶豫曰陰體虛駁氣易於乘也駁氣所乘陰陽相混無所為主不可屬左不可屬右受氣於兩岐之間隨所得駁氣之輕重而成形故所兼之形有不可得而同也人迎氣口論六陽六陰脈分屬左右手心小腸肝膽腎膀胱在左主血肺大腸脾胃命門三焦在右主氣男以氣成胎故氣為之主女以血成胎故血為之主若男子久病氣口充於人迎者有胃氣也病雖重可治女子久病人迎充於氣口者有胃氣也病雖重可治反此者逆或曰人迎在左氣口在右男女所同不易之位也脈法贊曰左大順男右大順女何子言之悖耶曰脈經一部王叔和諄諄於教醫者此左右手以醫者為主而言若主於病者奚止千里之謬春宣論春蠢也陽氣升浮草木萌芽蠢然而動前哲謂春時人氣在頭有病宜吐又曰傷寒大法春宜吐宣之為言揚也謂吐之法自上出也今之世俗往往有瘡痍者膈滿者蟲積以為不於春時宣瀉以毒藥不可愈也醫者遂用牽牛巴豆大黃枳殼防風輩為丸名之曰春宣丸於二月三月服之得下利而止於初瀉之時臟腑得通時暫輕快不知氣升在上則在下之陰甚弱而用利藥戕賊其陰其害何可勝言況仲景用承氣湯等下藥必有大滿大實堅有燥屎轉矢氣下逼迫而無表證者方行此法可下之證未悉具猶須遲以待之泄利之藥其可輕試乎余伯考形肥骨瘦味厚性沉五十歲輕於聽信忽於三月半贖春宣丸一帖服之下兩三行每年率以為常至五十三歲時七月初炎熱之甚無病暴死此豈非妄認春宣為春瀉而致禍耶自上召下曰宣宣之一字吐也明矣張子和先生已詳論之昔賢豈妄言哉詳之審訂無疑後之死者又有數人愚故表而出之以為後人之戒醇酒宜冷飲論醇酒之性大熱大毒清香美味既適於口行氣和血亦宜於體由是飲者不自覺其過於多也不思肺屬金性畏火其體脆其位高為氣之主腎之母木之夫酒下咽膈肺先受之若是醇者理宜冷飲過於肺入於胃然後漸溫肺先得溫中之寒可以補氣一益也次得寒中之溫可以養胃二益也冷酒行遲傳化以漸不可恣飲三益也古人終日百拜不過三爵既無酒病亦免酒禍今余稽之於禮經則曰飲齊視冬時飲齊酒也視猶比也冬時寒也參之內經則曰熱因寒用厥旨深矣今則不然不顧受傷只圖取快蓋熱飲有三樂存焉膈滯通快喉舌辛美蓋行可多不知酒性喜升氣必隨之痰鬱於上溺澀於下肺受賊邪金體必燥恣飲寒涼其熱內郁肺氣得熱必大傷耗其始也病淺或嘔吐或自汗或瘡痍或鼻查或自泄或心脾痛尚可發散而去之若其久也為病深矣為消為渴為內疸為肺痿為內痔為鼓脹為失明或喘哮為勞嗽為癲癇亦為難明之病倘非具眼未易處治可不謹乎或曰人言一盞冷酒須二盞血乃得行酒不可冷飲明矣余曰此齊東之語耳今參之於經證之以理發之為規戒子以為迂耶癰疽當分經絡論六陽經六陰經之分布周身有多氣少血者有少氣多血者有多氣多血者不可一概論也若夫要害處近虛怯薄處前哲已曾論及惟分經之言未聞也何則諸經惟少陽厥陰經之生癰疽理宜預防以其多氣少血其血本少肌肉難長瘡久未合必成死證其有不思本經少血遽用驅毒利藥以伐其陰分之血禍不旋踵矣請述一二成敗之跡以告來者余從叔父平生多慮質弱神勞年近五十忽左膊外側廉上起一小紅腫大約如栗豫視之曰慎勿輕視且生與人參大料作湯得二三斤為好人未之信謾進小帖數服未解而止旬余值大風拔木瘡上起一道紅如線繞至背胛直抵右肋豫曰必大料人參少加當歸川芎陳皮白朮等補劑與之後與此方兩閲月而安又東陽李兄年逾三十形瘦膚厚連得憂患又因作勞且過於色忽左腿外側廉上一紅腫其大如栗一醫問其大腑堅實與承氣兩帖下之不效又一醫教與大黃硃砂生粉草麒麟竭又二三帖半月後召豫視之曰事去矣又一李兄年四十餘而面稍白神甚勞忽脅下生一紅腫如桃一人教用神劑衆笑且排於是流氣飲十宣散雜而進之旬余召豫視之豫曰非惟不與補藥抑且多得解利血氣俱憊矣已而果然或曰太陽經非多血少氣者乎何臀疽之生初無甚苦往往間有不救者吾子其能治之乎豫曰臀居小腹之後而又在其下此陰中之陰也其道遠其位闢雖曰多血氣運不到氣既不利血亦罕來中年之後不可生癰才有痛腫參之脈證但見虛弱便與滋補血氣無虧可保終吉若用尋常驅熱拔毒紓氣之藥虛虛之禍如指諸掌脾約丸論成無己曰約者結約之約胃強脾弱約束津液不得四布但輸膀胱故小便數而大便硬故曰脾約與此丸以下脾之結燥腸潤結化津流入胃大便利小便少而愈矣愚切有疑焉何者既曰約脾弱不能運也脾弱則土虧矣必脾氣之散脾血之耗也原其所由久病大下大汗之後陰血枯槁內火燔灼熱傷元氣又傷於脾而成此證傷元氣者肺金受火氣無所攝傷脾者肺為脾之子肺耗則液竭必竊母氣以自救金耗則木寡於畏土欲不傷不可得也脾失轉輸之令肺失傳送之官宜大便祕而難下小便數而無藏蓄也理宜滋養陰血使孤陽之火不熾而金行清化木邪有制脾土清健而運行精液乃能入胃則腸潤而通矣今以大黃為君枳實厚朴為臣雖有芍藥之養血麻仁杏仁之溫潤為之佐使用之熱甚而氣實者無有不安愚恐西北二方地氣高厚人稟壯實者可用若用於東南之人與熱雖盛而血氣不實者雖得暫通將見脾愈弱而腸愈燥矣後之欲用此方者須知在西北以開結為主在東南以潤燥為主慎勿膠柱而調瑟鼓脹論心肺陽也居上肝腎陰也居下脾居中亦陰也屬土經曰飲食入胃遊溢精氣上輸於脾脾氣散精上歸於肺通調水道下輸膀胱水精四布五經並行是脾具坤靜之德而有乾健之運故能使心肺之陽降腎肝之陰升而成天地交之泰是為無病之人今也七情內傷六淫外侵飲食不節房勞致虛脾土之陰受傷轉輸之官失職胃雖受谷不能運化故陽自升陰自降而成天地不交之否於斯時也清濁相混隧道壅塞氣化濁血瘀鬱而為熱熱留而久氣化成濕濕熱相生遂生脹滿經曰鼓脹是也以其補雖堅滿中空無物有似於鼓其病膠固難以治療又名曰蠱若蟲侵蝕有蠱之義驗之治法理宜補脾又須養肺金以制木使脾無賊邪之慮滋腎水以制火使肺得清化之令卻鹽味以防助邪斷妄想以保母氣無有不安醫不察病起於虛急於作效炫能希賞病者苦於脹急喜行利藥以求一時之快不知寬得一日半日其腫愈甚病邪甚矣真氣傷矣去死不遠古方惟禹餘糧丸又名石中黃丸又名紫金丸制肝補脾殊為切當亦須隨證亦須順時加減用之余友俞仁叔儒而醫連得家難年五十得此疾自制禹餘糧丸服之豫診其脈弦澀而數曰此丸新制鍛鍊之火邪尚存溫熱之藥太多宜自加減不可執方俞笑曰今人不及古人此方不可加減服之一月口鼻見血色骨立而死又楊兄年近五十性嗜好酒病瘧半年患脹病自察必死來求治診其脈弦而澀重則大瘧未愈手足瘦而腹大如蜘蛛狀豫教以參術為君當歸川芎芍藥為臣黃連陳皮茯苓厚朴為佐生甘草些少作濃湯飲之一日定三次彼亦嚴守戒忌一月後瘧因汗而愈又半年小便長而脹愈中間稍有加減大意只是補氣行濕又陳氏年四十餘性嗜酒大便時見血於春間患脹色黑而腹大其形如鬼診其脈數而澀重似弱豫以四物湯加黃連黃芩木通白朮陳皮厚朴生甘草作湯與之近一年而安一補氣一補血余藥大率相出入皆獲安以保天壽或曰氣無補法何子補氣而獲安果有說以通之乎豫曰氣無補法世俗之言也以氣之為病痞悶壅塞似難於補恐增病勢不思正氣虛者不能運行邪滯所著而不出所以為病經曰壯者氣行則愈怯者著而成病苟或氣怯不用補法氣何由行或曰子之藥審則審矣何效之遲也病者久在床枕必將厭子之迂而求速者矣豫曰此病之起或三五年或十餘年根深矣勢篤矣欲求速效自求禍耳知王道者能治此病也或曰脹病將終不可與利藥耶豫曰灼知其不因於虛受病亦淺脾胃尚壯積滯不痼而又有可下之證亦宜略與疏導若授張子和浚川散禹功丸為例行速攻之策實所不敢疝氣論疝氣之甚者睪丸連小腹急痛也有痛在睪丸者有痛在五樞穴邊者皆足厥陰之經也或有形或無形或有聲或無聲有形如瓜有聲如蛙自素問以下歷代名醫皆以為寒蓋寒主收引經絡得寒故引不行所以作痛理固然也有得寒而無疝者又必有說以通之可也豫嘗屢因門戶雪上有霜沒膝之水踢冰徒涉不曾病此以豫素無熱在內也因而思之此證始於濕熱在經鬱而至久又得寒氣外束濕熱之邪不得疏散所以作痛若只作寒論恐為未備或曰厥陰一經其道遠其位卑鬱積濕熱何由而致豫曰大勞則火起於筋醉飽則火起於胃房勞則火起於腎大怒則火起於肝本經火積之久母能生子虛濕氣便盛厥陰屬木繫於肝為將軍之官其性急速火性且又暴為寒所束宜其痛之大暴也愚見有用烏頭梔子等分作湯用之其效亦敏後因此方隨證與形加減用之無有不應然濕熱又須分多少而始治但濕者腫多㿗病是也又有挾虛而發者當以參術為用而以疏導藥佐之診其脈有甚沉緊而大豁無力者是也其痛亦輕惟覺重墜牽引耳秦桂丸論無子之因多起於婦人醫者不求其因起於何處遍閲古方惟秦桂丸其辭確其意專用藥溫熱近乎人情欣然授之鋭然服之甘受燔灼之禍猶且懵然不悔何者陽精之施也陰血能攝之精成其子血成其胞胎孕乃成今婦人之無子者率由血少不足以攝精也血之少也固非一端然欲得子者必須補其陰血使無虧缺乃可推其有餘以成胎孕何乃輕用熱劑煎熬臟腑血氣沸騰禍不旋踵矣或曰春氣溫和則萬物發生冬氣寒凜則萬物消殞非秦桂丸之溫熱何由得子臟溫暖而成胎耶豫曰詩言婦人和平則樂有子和則氣血不乖平則陰陽不爭今得此藥經血轉紫黑漸成衰少或先或後始則飲食驟進久則口苦而干陰陽不平血氣不和疾病蜂起焉能成胎縱使成胎生子亦多病而不壽以秦桂丸之耗損矣天真之陰也戒之慎之鄭廉使之子年十六求醫曰我生七個月患淋病五日七日必一發其發也大痛捫地叫天水道方行狀如漆和粟者約一盞許然後定診其脈輕則澀重則弦視其形瘦而稍長其色青而蒼意其父必因多服下部藥遺熱在胎留於子之命門而然遂以紫雪和黃柏細末丸梧子大曬十分乾而與二百丸作一服率以熱湯下以食物壓之又經半日痛大作連腰腹水道乃行下如漆和粟者一大碗許其病減十分之八後張子忠以陳皮一兩桔梗木通各半兩作一帖與之又下漆粟者一合許遂安父得燥熱且能病子況母得之者乎余書此以證東垣紅絲瘤之事惡寒非寒病惡熱非熱病論經曰惡寒戰栗皆屬於熱又曰禁栗如喪神守皆屬於火惡寒者雖當炎月若遇風霜重綿在身自覺凜凜戰栗禁栗動搖之貌如喪神守惡寒之甚原病式曰病熱甚而反覺自冷此為病熱實非寒也或曰往往見有得熱藥而少愈者何也豫曰病熱之人其氣炎上郁為痰飲抑遏清道陰氣不升病熱尤甚積痰得熱亦為暫退熱勢助邪其病益深或曰寒熱如此誰敢以寒涼與之非殺之而何豫曰古人遇戰栗之證有以大承氣下燥糞而愈者惡寒戰栗明是熱證但有虛實之分耳經曰陰虛則發熱夫陽在外為陰之衛陰在內為陽之守精神外馳嗜欲無節陰氣耗散陽無所附遂致浮散於肌表之間而惡熱也實非有熱當作陰虛治之而用補養之法可也或曰惡寒非寒宜用寒藥惡熱非熱宜用補藥甚駭耳目明示我之法可乎豫曰進士周本道年逾三十得惡寒病服附子數日而病甚求豫治診其脈弦而似緩豫以江茶入薑汁香油些少吐痰一升許減綿大半周甚喜豫曰未也燥熱已多血傷亦深須淡食以養胃內觀以養神則水可生而火可降彼勇於仕進一切務外不守禁忌豫曰若多與補血涼熱亦可稍安內外不靜腎水不生附毒必發病安後官於婺城巡夜冒寒非附子不可療而性怕生薑只得以豬腰子作片煮附子與三帖而安豫曰可急歸知其附毒易發彼以為迂半年後果發背而死又司丞叔平生腳自踝以下常覺熱冬不可加綿於上常自言曰我稟質壯不怕冷豫曰此足三陰之虛宜早斷欲事以補養陰血庶乎可免笑而不答年方五十患痿半年而死觀此二人治法蓋可知矣或曰傷寒病惡寒惡熱者亦是虛耶豫曰若病傷寒者自外入內先賢論之詳矣經水或紫或黑論經水者陰血也陰必從陽故其色紅稟火色也血為氣之配氣熱則熱氣寒則寒氣升則升氣降則降氣凝則凝氣滯則滯氣清則清氣濁則濁往往見有成塊者氣之凝也將行而痛者氣之滯也來後作痛者氣血俱虛也色淡者亦虛也錯經妄行者氣之亂也紫者氣之熱也黑者熱之甚也人但見其紫者黑者作痛者成塊者率指為風冷而行溫熱之劑禍不旋踵矣良由病源論月水諸病皆曰風冷乘之宜其相習而成俗也或曰黑北方水之色也紫淡於黑非冷而何豫曰經曰亢則害承乃制熱甚者必兼水化所以熱則紫甚則黑也況婦人性執而見鄙嗜欲加倍臟腑厥陽之火無日不起非熱而何若夫風冷必須外得設或有之蓋千百而一二者也石膏論本草藥之命名固有不可曉者中間亦多有意義學者不可以不察以色而名者大黃紅花白前青黛烏梅之類是也以形而名者人參狗脊烏頭貝母金鈴子之類是也以氣而名者木香沉香檀香麝香茴香之類是也以質而名者厚朴乾薑茯苓生熟地黃之類是也以味而名者甘草苦參淡竹葉草龍膽苦酒之類是也以能而名者百合當歸升麻防風滑石之類是也以時而名者半夏茵陳冬葵寅雞夏枯草之類是也以石膏火煅細研醋調封丹爐其固密甚於脂苟非有膏焉能為用此兼質與能而得名正與石脂同意閻孝忠妄以方解石為石膏況石膏其味甘而辛本陽明經藥陽明主肌肉其甘也能緩脾益氣止渴去火其辛也能解肌出汗上行至頭又入手太陰手少陽彼方解石者止有體重質堅性寒而已求其所謂有膏而可為三經之主治者焉在哉醫欲責效不亦難乎脈大必病進論脈血之所為屬陰大洪之別名火之象屬陽其病得之於內傷者陰虛為陽所乘故脈大當作虛治之其病得之於外傷者邪客於經脈亦大當作邪勝治之合二者而觀之皆病證方長之勢也謂之病進不亦宜乎海藏云君侵臣之事也孰為是否幸有以教之生氣通天論病因章句辨禮記曰一年視離經謂離析經理在乎章句之絶內經生氣通天論病因四章第一章論因於寒欲如運樞以下三句與上文意不相屬皆衍文也體若燔炭汗出而散兩句當移在此夫寒邪初客於肌表邪鬱而為熱有似燔炭得汗則解此仲景麻黃湯之類是也第二章論因於暑暑者君火為病火主動則散故自汗煩渴而多言也第三章論因於濕濕者土濁之氣首為諸陽之會其位高而氣清其體虛故聰明得而系焉濁氣熏蒸清道不通沉重而不爽利似乎有物以蒙冒之失而不治濕鬱為熱熱留不去大筋軟短者熱傷血不能養筋故為拘攣小筋弛長者濕傷筋不能束骨故為痿弱因於濕首如裹各三字為句濕熱不攘以下各四字為句文正而意明第四章論因於氣為腫下文不序病證蓋是脫簡四維相代二句與上文意不相屬亦衍文也王太僕曰暑熱濕氣三病皆以為發於傷寒之毒次第相仍展轉生病五段通為一章余有疑焉暑病不治伏而生熱熱久生濕濕久氣病蓋有之矣內經止有冬傷於寒不即病至夏有熱病之言未聞寒毒伏藏至夏發於暑病至於濕病亦蒙上文之熱謂反濕其首若濕物裹之望除其熱當以因於濕首為句如裹濕又為句則濕首之濕裹濕之濕皆人為也與上下文列言寒暑之病因文義舛乖不容於不辨或曰先賢言溫濕寒濕風濕矣未聞有所謂濕熱病者攻之內經亦無有焉吾子無乃失之迂妄耶豫曰六氣之中濕熱為病十居八九內經發明濕熱此為首出至真要大論曰濕上甚而熱其間或言濕而熱在中者或曰熱而濕在中者此聖人愛人論道之極致使天下後世不知濕熱之治法者太僕啓之也君其歸取原病式熟讀而審思之幸甚太僕章句因於寒欲如運樞起居如驚神氣乃浮因於暑汗煩則喘喝靜則多言體若燔炭汗出而散因於濕首句如裹濕句熱不攘句大筋軟短小筋弛長軟短為拘弛長為痿因於氣為腫云云新定章句因於寒體若燔炭汗出而散因於暑汗煩則喘喝靜則多言因於濕句首如裹句濕熱不攘句大筋軟短小筋弛長軟短為拘弛長為痿因於氣為腫云云倒倉論經曰腸胃為市以其無物不有而谷為最多故謂之倉若積穀之室也倒者傾去積舊而滌濯使之潔淨也胃居中屬土喜容受而不能自運者也人之飲食遇適口之物寧無過量而傷積之乎七情之偏五味之厚寧無傷於沖和之德乎糟粕之餘停痰瘀血互相糾纏日積月深鬱結成聚甚者如核桃之穰諸般奇形之蟲中宮不清矣土德不和也誠於中形於外發為癱瘓為勞瘵為蠱脹為癩疾為無名奇病先哲製為萬病丸溫白丸等劑攻補兼施寒熱並用期中病情非不工巧然不若倒倉之為便捷也以黃牡牛擇肥者買一二十斤長流水煮麋爛融入湯中為液以布濾出渣滓取淨汁再入鍋中文火熬成琥珀色則成矣每飲一鍾少時又飲如此者積數十鍾寒月則重湯溫而飲之病在上者欲其吐多病在下者欲其利多病在中者欲其吐下俱多全在活法而為之緩急多寡也須先置一室明快而不通者以安病人視所出之物可盡病根則止吐利後或渴不得與湯其小便必長取以飲病者名曰輪回酒與一二碗非惟可以止渴抑且可以滌濯余垢睡一二日覺飢甚乃與粥淡食之待三日後始與少菜羹自養半月覺精神渙發形體輕健沉疴悉安矣其後須五年忌牛肉吾師許文懿始病心痛用藥燥熱香辛如丁附桂姜輩治數十年而足攣痛甚且惡寒而多嘔甚而至於靈砂黑錫黃芽歲丹繼之以艾火十餘萬又雜治數年而痛甚自分為廢人矣衆工亦技窮矣如此者又數年因其煩渴惡食者一月以通聖散與半月餘而大腑逼迫後重肛門熱氣如燒始時下積滯如五色爛錦者如桕燭油凝者近半月而病似退又半月而略思谷而兩足難移計無所出至次年三月遂作此法節節如應因得為全人次年再得一男又十四年以壽終其餘與藥一婦人久年腳氣吐利而安又鎮海萬戶蕭伯善公以便濁而精不禁親與試之有效又臨海林兄患久嗽吐紅發熱消瘦衆以為瘵百方不應召豫視之脈兩手弦數日輕夜重計無所出亦因此而安時冬月也第二年得一子牛坤土也黃土之色也以順為德而效法乎健以為功者牡之用也肉者胃之樂也熟而為液無形之物也橫散入肉絡由腸胃而滲透肌膚毛竅爪甲無不入也積聚久則形質成依附腸胃回薄曲折處以為棲泊之窠臼阻礙津液氣血熏蒸燔灼成病自非剖腸刮骨之神妙孰能去之又豈合勺銖兩之丸散所能竅犯其藩牆戶牖乎竊詳肉液之散溢腸胃受之其厚皆倍於前有似乎腫其回薄曲折處非復向時之舊肉液充滿流行有如洪水泛漲其浮莝陳朽皆推逐蕩漾順流而下不可停留表者因吐而汗清道者自吐而湧濁道者自泄而去凡屬滯礙一洗而定牛肉全重厚和順之性盎然渙然潤澤枯槁補益虛損寧無精神渙發之樂乎正似武王克商之後散財發粟以賑殷民之仰望也其方出於西域之異人人於中年後亦行一二次亦卻疾養壽之一助也相火論太極動而生陽靜而生陰陽動而變陰靜而合而生水火木金土各一其性惟火有二曰君火人火也曰相火天火也火內陰而外陽主乎動者也故凡動皆屬火以名而言形氣相生配於五行故謂之君以位而言生於虛無守位稟命因其動而可見故謂之相天主生物故恆於動人有此生亦恆於動其所以恆於動皆相火之為也見於天者出於龍雷則木之氣出於海則水之氣也具於人者寄於肝腎二部肝屬木而腎屬水也膽者肝之腑膀胱者腎之腑心胞絡者腎之配三焦以焦言而下焦司肝腎之分皆陰而下者也天非此火不能生物人非此火不能有生天之火雖出於木而皆本乎地故雷非伏龍非蟄海非附於地則不能鳴不能飛不能波也鳴也飛也波也動而為火者也肝腎之陰悉具相火人而同乎天也或曰相火天人之所同何東垣以為元氣之賊又曰火與元氣不兩立一勝則一負然則如之何而可以使之無勝負也曰周子曰神發知矣五性感物而萬事出有知之後五者之性為物所感不能不動謂之動者即內經五火也相火易起五性厥陽之火相扇則妄動矣火起於妄變化莫測無時不有煎熬真陰陰虛則病陰絶則死君火之氣經以暑與濕言之相火之氣經以火言之蓋表其暴悍酷烈有甚於君火者也故曰相火元氣之賊周子又曰聖人定之以中正仁義而主靜朱子曰必使道心常為一身之主而人心每聽命焉此善處乎火者人心聽命乎道心而又能主之以靜彼五火之動皆中節相火惟有裨補造化以為生生不息之運用耳何賊之有或曰內經相火注曰少陰少陽矣未嘗言及厥陰太陽而吾子言之何耶曰足太陽少陰東垣嘗言之矣治以炒柏取其味辛能瀉水中之火是也戴人亦言膽與三焦尋火治肝和胞絡都無異此歷指龍雷之火也豫亦備述天人之火皆生於動如上文所云者實推廣二公之意或曰內經言火不一往往於六氣中見之言臟腑者未之見也二公豈它有所據耶子能為我言之乎經曰百病皆生於風寒暑濕燥火之動而為變者岐伯歷舉病機一十九條而屬火者五此非相火之為病之出於臟腑者乎考諸內經少陽病為瘛瘲太陽病時眩僕少陰病瞀暴喑鬱冒不知人非諸熱瞀瘈之屬火乎少陽病惡寒鼓栗膽病振寒少陰病灑淅惡寒振栗厥陰病灑淅振寒非諸禁鼓栗如喪神守之屬火乎少陽病嘔逆厥氣上行膀胱病沖頭痛太陽病厥氣上衝胸小腹控睪引腰脊上衝心少陰病氣上衝胸嘔逆非諸逆衝上之屬火乎少陽病譫妄太陽病譫妄膀胱病狂顛非諸躁狂越之屬火乎少陽病胕腫善驚少陰病瞀熱以酸胕腫不能久立非諸病胕腫疼酸驚駭之屬火乎又原病式曰諸風掉眩屬於肝火之動也諸氣膹郁病痿屬於肺火之升也諸濕腫滿屬於脾火之勝也諸痛癢瘡瘍屬於心火之用也是皆火之為病出於臟腑者然也注文未之發耳以陳無擇之通敏且以暖熾論君火日用之火言相火而又不曾深及宜乎後之人不無聾瞽也悲夫左大順男右大順女論肺主氣其脈居右寸脾胃命門三焦各以氣為變化運用故皆附焉心主血其脈居左寸肝膽腎膀胱皆精血之隧道管庫故亦附焉男以氣成胎則氣為之主女挾血成胎則血為之主男子久病右脈充於左脈者有胃氣也病雖重可治女子久病左脈充於右者有胃氣也病雖重可治反此者虛之甚也或曰左心小腸肝膽腎膀胱右肺大腸脾胃命門三焦男女所同不易之位也脈法贊曰左大順男右大順女吾子之言非惟左右倒置似以大為充果有說以通之乎曰大本病脈也今以大為順蓋有充足之義故敢以充言之脈經一部諄諄於教為醫者爾此左右當以醫者為言若主於病奚止於千里之謬或曰上文言肝心出左脾肺出右左主司官右主司府下文言左為人迎右為氣口皆以病人之左右而為言何若是之相反耶曰脈經第九篇之第五章上文大浮數動長滑沉澀弱弦短微此言形狀之陰陽下文關前關後等語又言部位之陰陽陰附陽陽附陰皆言血氣之陰陽同為論脈之陰陽而所指不同若此上下異文何足疑乎贊曰陰病治官非治血乎陽病治腑非治氣乎由此參考或恐與經意有合茹淡論或問內經謂精不足者補之以味又曰地食人以五味古者年五十食肉子今年邁七十矣盡卻鹽醯豈中道乎何子之神茂而色澤也曰味有出於天賦者有成於人為者天之所賦者若谷菽菜果自然沖和之味有食人補陰之功此內經所謂味也人之所為者皆烹飪調和偏厚之味有致疾伐命之毒此吾子所疑之味也今鹽醯之卻非真茹淡者大麥與栗之咸粳米山藥之甘蔥薤之辛之類皆味也子以為淡乎安於沖和之味者心之收火之降也以偏厚之味為安者欲之縱火之勝也何疑之有內經又曰陰之所生本在五味非天賦之味乎陰之五宮傷在五味非人為之味乎聖人防民之具於是為備凡人飢則必食彼粳米甘而淡者土之德也物之屬陰而最補者也惟可與菜同進經以菜為充者恐於飢時頓食或慮過多因致胃損故以菜助其充足取其疏通而易化此天地生物之仁也論語曰肉雖多不使勝食氣傳曰賓主終日百拜而酒三行以避酒禍此聖人施教之意也蓋谷與肥鮮同進厚味得谷為助其積之也久寧不助陰火而致毒乎故服食家在卻谷者則可不卻谷而服食未有不被其毒者內經謂久而增氣物化之常氣增而久夭之由也彼安於厚味者未之思爾或又問精不足者補之以味何不言氣補曰味陰也氣陽也補精以陰求其本也故補之以味若甘草白朮地黃澤瀉五味子天門冬之類皆味之厚者也經曰虛者補之正此意也上文謂形不足者溫之以氣夫為勞倦所傷氣之虛故不足溫者養也溫存以養使氣自充氣完則形完矣故言溫不言補經曰勞者溫之正此意也彼為局方者不知出此凡諸虛損證悉以溫熱佐輔補藥名之曰溫補不能求經旨者也吃逆論吃病氣逆也氣自臍下直衝上出於口而作聲之名也書曰火炎上內經曰諸逆衝上皆屬於火東垣謂火與元氣不兩立又謂火氣之賊也古方悉以胃弱言之而不及火且以丁香柿蒂竹茹陳皮等劑治之未審孰為降火孰為補虛人之陰氣依胃為養胃土傷損則木氣侮之矣此土敗木賊也陰為火所乘不得內守木挾相火乘之故直衝清道而上言胃弱者陰弱也虛之甚也病人見此似為死證然亦有實者不可不知敢陳其說趙立道年近五十質弱而多怒七月炎暑大飢索飯其家不能急具因大怒兩日後得滯下病口渴自以冷水調生蜜飲之甚快滯下亦漸緩如此者五七日召豫視脈稍大不數遂令止蜜水渴時但令以人參白朮煎湯調益元散與之滯下亦漸收七八日後覺倦甚發吃豫知其因下久而陰虛也令其守前藥然滯下尚未止又以煉蜜飲如此者三日吃猶未止衆皆尤藥之未當將以薑附飲之豫曰補藥無速效附子非補陰者服之必死衆曰冷水飯多得無寒乎豫曰炎暑如此飲涼非寒勿多疑待以日數力到當自止又四日而吃止滯下亦安又陳擇仁年近七十厚味之人也有久喘病而作止不常新秋患滯下食大減至五七日後吃作召豫視脈皆大豁衆以為難豫曰形瘦者尚可為以人參白朮湯下大補丸以補血至七日而安此二人者虛之為也又一女子年逾笄性躁味厚暑月因大怒而吃作每作則舉身跳動神昏不知人問之乃知暴病視其形氣俱實遂以人參蘆煎湯飲一碗大吐頑痰數碗大汗昏睡一日而安人參入手太陰補陽中之陰者也蘆則反爾大瀉太陰之陽女子暴怒氣上肝主怒肺主氣經曰怒則氣逆氣因怒逆肝木乘火侮肺故吃大作而神昏參蘆喜吐痰盡氣降而火衰金氣復位胃氣得和而解麻黃髮汗節能止汗谷屬金糠之性熱麥屬陽麩之性涼先儒謂物物具太極學者其可不觸類而長引而伸之乎房中補益論或問千金方有房中補益法可用否豫應之曰傳曰吉凶悔吝生乎動故人之疾病亦生於動其動之極也病而死矣人之有生心為火居上腎為水居下水能升而火能降一升一降無有窮已故生意存焉水之體靜火之體動動易而靜難聖人於此未嘗忘言也儒者立教曰正心收心養心皆所以防此火之動於妄也醫者立教恬淡虛無精神內守亦所以遏此火之動於妄也蓋相火藏於肝腎陰分君火不妄動相火惟有稟命守位而已焉有燔灼之虐焰飛走之狂勢也哉易兌取象於少女兌說也遇少男艮為咸咸無心之感也艮止也房中之法有艮止之義焉若艮而不止徒有戕賊何補益之有竊詳千金之意彼壯年貪縱者水之體非向日之靜也故著房中之法為補益之助此可用於質壯心靜遇敵不動之人也苟無聖賢之心神仙之骨未易為也女法水男法火水能制火一樂於興一樂於取此自然之理也若以房中為補殺人多矣況中古以下風俗日偷資稟日薄說夢向癡難矣哉天氣屬金說邵子曰天依地地依天天地自相依附內經曰大氣舉之也夫自清濁肇分天以氣運於外而攝水地以形居中而浮於水者也是氣也即天之謂也自其無極者觀之故曰大氣至清至剛至健屬乎金者也非至剛不能攝此水非至健不能運行無息以舉地之重非至清其剛健不能長上古而不老或曰子以天氣為屬金者固易卦取象之義何至遂以屬金言之乎善言天者必有證於人善言大者必有譬於小願明以告我曰天生萬物人為貴人形象天可以取譬肺主氣外應皮毛內經謂陽為外衛非皮毛乎此天之象也其包裹骨肉臟腑於其中此地之象也血行於皮里肉腠晝夜周流無端此水之象也合三者而觀非水浮地天攝水地懸於中乎聖人作易取金為氣之象厥有旨哉張子和攻擊注論愚閲張子和書惟務攻擊其意以為正氣不能自病因為邪所客所以為病也邪去正氣自安因病有在上在中在下深淺之不同立為汗吐下三法以攻之初看其書將謂醫之法盡於是矣後因思內經有謂之虛者精氣虛也謂之實者邪氣實也夫邪所客必因正氣之虛然後邪得而客之苟正氣實邪無自入之理由是於子和之法不能不致疑於其間又思內經有言陰平陽祕精神乃治陰陽離決精氣乃絶又思仲景有言病當汗解診其尺脈澀當與黃耆建中湯補之然後汗之於是以子和之書非子和之筆也馳名中土其法必有過於朋輩者何其書之所言與內經仲景之意若是之不同也於是決意於得名師以為之依歸發其茅塞遂遊江湖但聞某處有某治醫便往拜而問之連經數郡無一人焉後到定城始得原病式東垣方稿乃大悟子和之孟浪然終未得的然之議論將謂江浙間無可為師者泰定乙丑夏始得聞羅太無並陳芝岩之言遂往拜之蒙叱罵者五七次趑趄三閲月始得降接因觀羅先生治一病僧黃瘦倦怠羅公診其病因乃蜀人出家時其母在堂及遊浙右經七年忽一日念母之心不可遏欲歸無腰纏徒而朝夕西望而泣以是得病時僧二十五歲羅令其隔壁泊宿每日以牛肉豬肚甘肥等煮糜爛與之凡經半月餘且時以慰諭之言勞之又曰我與鈔十錠作路費我不望報但欲救汝之死命爾察其形稍蘇與桃仁承氣一日三帖下之皆是血塊痰積方止次日只與熟菜稀粥將息又半月其人遂如故又半月餘與鈔十錠遂行因大悟攻擊之法必其人充實稟質本壯乃可行也否則邪去而正氣傷小病必重重病必死羅每日有求醫者來必令其診視脈狀回稟羅但臥聽口授用某藥治某病以某藥監其藥以某藥為引經往來一年半並無一定之方至於一方之中自有攻補兼用者亦有先攻後補者有先補後攻者又大悟古方治今病焉能吻合隨時取中其此之謂乎是時羅又言用古方治今病正如拆舊屋湊新屋其材木非一不再經匠氏之手其可用乎由是又思許學士釋微論曰豫讀仲景書用仲景之法然未嘗守仲景之方乃為得仲景之心也遂取東垣方稿手自抄録乃悟治病人當如漢高祖縱秦暴周武王縱商之後自非發財散粟與三章之法其受傷之氣惓憊之人何由而平復也於是定為陰易乏陽易亢攻擊宜詳審正氣須保護以局方為戒哉
