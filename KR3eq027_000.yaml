front:
  text: 序素問載道之書也詞簡而義深去古漸遠衍文錯簡仍或有之故非吾儒不能讀學者以易心求之宜其茫若望洋淡如嚼蠟遂直以為古書不宜於今厭而棄之相率以為局方之學間有讀者又以濟其方技漫不之省醫道隱晦職此之由可嘆也震昌三十歲時因母之患脾疼衆工束手由是有志於醫遂取素問讀之三年似有所得又二年母氏之疾以藥而安因追念先子之內傷伯考之瞀悶叔考之鼻衄幼弟之腿痛室人之積痰一皆歿於藥之誤也心膽摧裂痛不可追然猶慮學之未明至四十歲復取而讀之顧以質鈍遂朝夕鑽研缺其所可疑通其所可通又四年而得羅太無諱知悌者為之師因見河間戴人東垣海藏諸書始悟濕熱相火為病甚多又知醫之為書非素問無以立論非本草無以主方有方無論無以識病有論無方何以模仿夫假說問答仲景之書也而詳於外感明著性味東垣之書也而詳於內傷醫之為書至是始備醫之為道至是始明由是不能不致疑於局方也局方流行自宋迄今罔間南北翕然而成俗豈無其故哉徐而思之濕熱相火自王太僕注文已成湮沒至張李諸老始有發明人之一身陰不足而陽有餘雖諄諄然見於素問而諸老猶未表章是宜局方之盛行也震昌不揣蕪陋陳於編冊並述金匱之治法以證局方之未備間以己意附之於後古人以醫為吾儒格物致知一事故目其篇曰格致餘論未知其果是否耶後之君子幸改而正諸飲食色欲針序傳曰飲食男女人之大欲存焉豫每思之男女之欲所關甚大飲食之欲於身尤切世之淪胥陷溺於其中者蓋不少矣苟志於道必先於此究心焉因作飲食色欲二針以示弟侄並告諸同志云飲食針人身之貴父母遺體為口傷身滔滔皆是人有此身飢渴洊興乃作飲食以遂其生眷彼昧者因縱口味五味之過疾病蜂起病之生也其機甚微饞涎所牽忽而不思病之成也飲食俱廢憂貽父母醫禱百計山野貧賤淡薄是諳動作不衰此身亦安均氣同體我獨多病悔悟一萌塵開鏡淨日節飲食易之象辭養小失大孟子所譏口能致病亦敗爾德守口如瓶服之無斁色欲針惟人之生與天地參坤道成女乾道成男配為夫婦生育攸寄血氣方剛惟其時矣成之以禮接之以時父子之親其要在茲眷彼昧者徇情縱欲惟恐不及濟以燥毒氣陽血陰人身之神陰平陽祕我體長春血氣幾何而不自惜我之所生翻為我賊女之耽兮其欲實多閨房之肅門庭之和士之耽兮其家自廢既喪厥德此身亦瘁遠彼帷薄放心乃收飲食甘美身安病瘳
